        <circle cx="80" cy="50" r="4" fill="#7B68EE"/>
        <circle cx="20" cy="50" r="4" fill="#7B68EE"/>
        <circle cx="68" cy="32" r="3" fill="#9370DB"/> <circle cx="32" cy="68" r="3" fill="#6495ED"/> </g>

      <g id="connections" stroke="#C3BDE0" stroke-width="1.5"> <line x1="50" y1="50" x2="30" y2="35"/>
        <line x1="50" y1="50" x2="70" y2="65"/>
        <line x1="50" y1="50" x2="50" y2="20"/>
        <line x1="50" y1="50" x2="50" y2="80"/>
