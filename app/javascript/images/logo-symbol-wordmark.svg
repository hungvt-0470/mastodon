<svg width="250" height="60" viewBox="0 0 125 30" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <symbol id="logo-symbol-wordmark" viewBox="0 0 450 100"> <g id="sphere-graphic">
