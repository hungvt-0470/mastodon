        <line x1="50" y1="50" x2="32" y2="68"/>

        <line x1="30" y1="35" x2="50" y2="20"/>
        <line x1="30" y1="35" x2="20" y2="50"/>
        <line x1="70" y1="65" x2="50" y2="80"/>
        <line x1="70" y1="65" x2="80" y2="50"/>
        <line x1="50" y1="20" x2="68" y2="32"/>
        <line x1="50" y1="80" x2="32" y2="68"/>
        <line x1="80" y1="50" x2="68" y2="32"/>
        <line x1="20" y1="50" x2="32" y2="68"/>
      </g>
